  <style>
    :root{--black:#090a09;--gold:#dab16a;--green:#06c755;--muted:#aaa79f}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;overflow-x:hidden;overflow-y:auto;background:var(--black);color:#fff;font-family:"Noto Sans Thai",Arial,sans-serif}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 48%,#5c47251c 0 12%,transparent 37%),linear-gradient(115deg,transparent 46%,#dab16a08 50%,transparent 54%);animation:sweep 9s ease-in-out infinite}.page{position:relative;isolation:isolate;min-height:100svh;padding:clamp(24px,4vw,64px);display:grid;grid-template-rows:auto 1fr auto}.brand{width:clamp(180px,18vw,238px);color:#fff;text-decoration:none;line-height:0}.brand img{display:block;width:100%;height:auto;object-fit:contain}.stage{display:grid;place-items:center;text-align:center}.content{position:relative;z-index:3;max-width:760px}.kicker{margin:0 0 22px;color:var(--gold);font-size:9px;font-weight:600;letter-spacing:.28em}.code{position:relative;margin:0;color:#fff;font:400 clamp(125px,22vw,320px)/.65 "Cormorant Garamond",serif;letter-spacing:-.1em;text-shadow:0 0 70px #dab16a0d}.code:after{content:"";position:absolute;left:50%;top:50%;width:clamp(190px,30vw,430px);aspect-ratio:1;border:1px solid #dab16a42;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 42px #dab16a12,0 0 0 88px #dab16a08;animation:orbit 18s linear infinite}.content h1{position:relative;z-index:2;margin:56px 0 14px;font:400 clamp(35px,5vw,68px)/1 "Cormorant Garamond","Noto Sans Thai",serif;letter-spacing:-.025em}.content h1 em{color:var(--gold);font-weight:400}.content>p:last-of-type{max-width:590px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.9}.actions{position:relative;z-index:4;margin-top:34px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{min-height:54px;padding:0 25px;display:inline-flex;align-items:center;justify-content:center;gap:18px;border:1px solid #ffffff28;color:#fff;text-decoration:none;font-size:12px;transition:.3s}.btn:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 15px 35px #0008}.btn-primary{background:#fff;color:#111;border-color:#fff}.btn-line{position:relative;background:var(--green);border-color:var(--green);font-weight:600}.btn-line:after{content:"";position:absolute;inset:-4px;border:2px solid #06c7558c;opacity:0;animation:aura 2.2s ease-out infinite}.footer{display:flex;justify-content:space-between;gap:22px;color:#77766f;font-size:8px;letter-spacing:.16em}.footer span:last-child{color:#a98b55}@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes sweep{0%,22%{transform:translateX(-35%)}70%,100%{transform:translateX(35%)}}@keyframes aura{0%{opacity:.65;transform:scale(.96)}75%,100%{opacity:0;transform:scale(1.14)}}@media(max-width:600px){.page{padding:22px}.brand{width:185px}.code{font-size:130px}.code:after{width:190px;box-shadow:0 0 0 28px #dab16a12,0 0 0 57px #dab16a08}.content h1{margin-top:55px;font-size:38px}.actions{flex-direction:column}.btn{width:100%}.footer{align-items:flex-start;flex-direction:column;gap:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

  <script>
    (()=>{const links=[document.getElementById('homeLink'),document.getElementById('brandHomeLink')];const favicon=document.getElementById('errorFavicon');let home='index.html';if(location.protocol!=='file:'){const parts=location.pathname.split('/').filter(Boolean);home=location.hostname.endsWith('github.io')&&parts.length?`/${parts[0]}/`:'/'}links.forEach(link=>{if(link)link.href=home});if(favicon)favicon.href=`${home}favicon.ico`})();
